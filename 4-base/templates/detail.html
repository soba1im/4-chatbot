<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bot.name }} - 통신 연결</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbit&display=swap');
        @font-face {
            font-family: 'DXTaja';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DXTaja.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2507-2@1.0/BoldDungGeunMo.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* main-game-ui가 body(100vh flex column)를 꽉 채우고,
           내부 game-layout이 flex:1로 나머지 높이를 차지하게 해
           사이드바 높이를 모든 장면에서 동일하게 고정 */
        #main-game-ui {
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        body {
            /* 우주선 배경 이미지 */
            background-image: url("{{ url_for('static', filename='images/hateslop/corridor_bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-color: #050814;
            font-family: 'Pretendard', 'IBM Plex Sans KR', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-header {
            padding-top: 30px;
            padding-bottom: 20px;
            padding-left: min(80px, 5.56vw);
        }
        .logo { width: min(280px, 19.44vw); }

        /* 메인 레이아웃 (좌측 메뉴 + 중앙 화면) */
        .game-layout {
            display: flex;
            flex: 1;
            padding: 0 40px;
            position: relative;
        }

        /* 좌측 사이드바 (전력량, 메뉴, 추천 질문) */
        .sidebar {
            width: min(340px, 23.61vw);
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            padding: 10px 15px;
        }

        /* 유리 질감 공통 클래스 (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
        }

        

        /* 미니 피코 아이콘 5개 묶음 (배경 이미지 위로 띄움) */
        .battery-icons {
            position: absolute; /* 중요! 이미지 위로 강제로 띄움 */
            bottom: 22%; /* 배경 박스의 맨 아래에서 22% 높이에 배치 */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px; /* 피코 아이콘 사이 간격 */
        }

        /* 5칸짜리 미니 피코 아이콘 기본 상태 */
        .battery-img {
            width: 24px; /* 박스 크기에 맞춰 아이콘 크기 살짝 조절 */
            height: auto;
            transition: all 0.3s ease;
        }

        /* 전력이 소모되었을 때의 클래스 */
        .battery-img.empty {
            opacity: 0.2;
            filter: grayscale(100%);
        }

        .sidebar-panel-img {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            z-index: 0;
        }

        .sidebar-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            flex: 1;
        }

        .ui-img-box {
            position: relative;
            width: 100%;
        }

        .ui-img-box > img {
            width: 100%;
            height: auto;
            display: block;
        }

        .power-wrapper {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .power-wrapper > img:first-child {
            width: 100%; 
            height: auto; /* 💡 높이를 auto로 주어 원본 이미지 비율 유지 */
            display: block;
        }

        .ui-img-box.menu-btn {
            position: relative;
            width: 100%;
            flex-shrink: 0;
            /* height: 80px; 삭제 */
            /* flex-shrink: 0; 삭제 */
        }

        .ui-img-box.menu-btn > img {
            width: 100%; 
            height: auto; /* 💡 비율 유지 */
            display: block;
        }

        .power-wrapper .battery-icons {
            position: absolute;
            bottom: 20%;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .menu-btn {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .menu-btn:hover {
            transform: scale(1.03);
        }

        .recommend-text-list ul {
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }

        .recommend-text-list li {
            cursor: pointer;
            font-family: 'Orbit', sans-serif;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .recommend-text-list li:hover {
            color: #f7e9a0;
        }

        .recommend-wrapper {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }

        .recommend-wrapper > img:first-child {
            width: 100%; 
            height: auto; /* 💡 비율 유지 */
            display: block;
        }

        .recommend-wrapper .recommend-text-list {
            position: absolute;
            top: min(65px, 19.12%);
            left: 0;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .recommend-text-list p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.1rem;
            margin-bottom: 12px;
            line-height: 1.4;
            word-break: keep-all;
            cursor: pointer;
            transition: color 0.2s;
        }

        .recommend-text-list p:hover {
            color: #f7e9a0;
        }

        .chat-history-text {
            margin-top: 30px;
            font-family: 'Pretendard', sans-serif;
            font-size: 1.15rem;
            text-align: center;
            color: #a8d5e5;
            max-width: 750px;
            word-break: keep-all;
            line-height: 1.6;
            white-space: pre-line;
        }

        /* 중앙 화면 (캐릭터 & 홀로그램) */
        .center-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 피코 이미지 */
        .character-pico {
            width: min(950px, 65.97vw); /* 💡 크기 조절: 이 숫자를 키우면 커지고, 줄이면 작아집니다. */
            margin-top: 40px; /* 💡 상하 위치 조절: 음수(-)를 넣으면 위로, 양수(+)를 넣으면 아래로 이동합니다. */
            margin-left: 0px;  /* 💡 좌우 위치 조절: 기본은 중앙이지만, 살짝 옆으로 옮기고 싶다면 조절하세요. */
            animation: float 3s ease-in-out infinite;
        }

        /* 레이아웃 전환 속성 */
        .normal-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            /* 하단 고정 채팅입력창(bottom:60px + height:81px = 141px)에 가려지지 않도록 여백 확보 */
            padding-bottom: min(160px, 17.78vh);
        }

        .briefing-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            gap: 30px;
            width: 100%;
            flex: 1;
            padding-bottom: min(123px, 13.67vh);
            transform: translateY(20px) translateX(0px);
        }

        /* 피코 크기 상태 */
        .pico-normal {
            width: min(350px, 24.31vw); /* 원래 피코 크기에 맞게 조절 */
            transition: all 0.5s ease;
        }

        .pico-small {
            width: min(210px, 14.58vw);
            transition: all 0.5s ease;
            margin-bottom: 20px; 
            margin-right: 10px;  
        }

        /* 브리핑 박스 디자인 */
        /* 브리핑 텍스트 박스 + 화살표를 세로로 정렬하는 래퍼 */
        .briefing-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* 화살표를 박스의 오른쪽 아래로 정렬 (가운데를 원하면 center로 변경) */
            gap: 15px; /* 텍스트 박스와 화살표 사이의 간격 */
            width: min(650px, 45.14vw);
        }

        /* 브리핑 박스 디자인 (첨부 이미지 배경 적용) */
        .briefing-box {
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            width: min(680px, 47.22vw);
            height: min(480px, 53.33vh);
            padding: 55px 60px;
            box-sizing: border-box; 
            overflow: hidden;
        }

        .briefing-arrow-area {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 40px;
            margin-top: 5px;
            position: relative;
            z-index: 999;
        }

        #briefing-next-btn {
            cursor: pointer;
            transition: filter 0.2s; /* 부드러운 효과 */
        }

        /* 모든 화살표를 chat-container 기준 동일 위치에 고정 */
        .chat-container .next-arrow {
            position: absolute;
            top: -55px;
            right: 160px;
            margin-top: 0;
            flex-shrink: unset;
            pointer-events: auto;
        }

        .briefing-text {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.0rem;
            color: #cfd8dc;
            white-space: pre-wrap;
            line-height: 2.2;
            height: 100%;
            overflow-y: auto;
        }

        .briefing-text::-webkit-scrollbar {
            width: 0px; 
        }

        .align-right {
            align-self: flex-end; /* 화살표를 우측 하단으로 */
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* 하단 채팅 입력창 */
        .chat-container {
            position: fixed !important;
            bottom: min(60px, 6.67vh);
            left: min(450px, 31.25vw);
            width: min(1050px, 72.92vw) !important;
            z-index: 100;
            pointer-events: none;
        }

        .chat-container .send-btn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 101;
        }

        .chat-text-container {
            display: flex;
            align-items: flex-start; /* 💡 텍스트와 화살표를 상자 위쪽으로 끌어올림 */
            justify-content: flex-start;
            gap: 20px;
            margin-bottom: 30px; /* 💡 입력창과의 거리를 벌려 전체적으로 더 위로 위치하게 함 */
            width: 100%;
            max-width: min(900px, 62.5vw);
            max-height: min(350px, 38.89vh);
            padding-left: 50px;
        }

        .chat-history-text {
            font-family: 'Orbit', sans-serif; /* 💡 Orbit 폰트 적용 */
            font-size: 1.15rem;
            color: #4be1e6; /* 💡 원하는 색상으로 변경하세요! (현재는 약간의 노란빛이 도는 색상입니다) */
            text-align: left; /* 💡 왼쪽 정렬로 변경 */
            word-break: keep-all;
            line-height: 1.6;
            white-space: pre-wrap;
            width: min(900px, 62.5vw);
            max-height: min(350px, 38.89vh);
            overflow-y: auto;
        }

        .chat-history-text::-webkit-scrollbar {
            width: 4px;
        }

        .chat-history-text::-webkit-scrollbar-thumb {
            background: rgba(75, 225, 230, 0.4);
            border-radius: 2px;
        }

        .next-arrow {
            width: 35px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
            margin-top: 0px; /* 💡 텍스트 첫 줄 위치에 맞게 화살표를 살짝 아래로 미세 조정 */
        }

        .next-arrow:hover {
            transform: translateX(8px);
        }

        .custom-input-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            pointer-events: none;
        }

        .input-bg-img {
            width: 100%;
            height: min(81px, 9vh);
            object-fit: fill;
            border-radius: 8px !important;
            display: block;
            pointer-events: none;
        }

        .input-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        #user-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-family: 'Pretendard', sans-serif;
            outline: none;
            padding-left: 40px;
            pointer-events: auto;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .send-img-btn {
            width: 40px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: auto;
        }

        .send-img-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .briefing-image {
            width: min(700px, 48.61vw);
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            transform: translateY(-60px);
        }

        .mission-file-image {
            width: min(420px, 29.17vw);
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        #mission-file-area {
            transform: translateX(-180px) translateY(-50px);
        }

        .chat-record-image {
            width: min(680px, 47.22vw);
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        /* 페이즈 전환 애니메이션 클래스 */
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        .fade-in {
            display: block !important; /* display: none을 덮어씌움 */
            animation: fadeIn 1s forwards;
        }

        .auth-panel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #auth-panel {
            transform: translateY(-30px);
        }


        .auth-image {
            max-width: min(750px, 52.08vw);
            max-height: 68vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1) translateY(0); }
            to { opacity: 0; transform: scale(0.9) translateY(20px); visibility: hidden; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.1) translateY(-20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* === 단서 노트 전체 화면 === */
        #clue-note-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 500;
            flex-direction: column;
            padding: 30px 50px 50px;
            box-sizing: border-box;
            gap: 24px;
        }

        .clue-note-header {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .clue-note-logo {
            height: 52px;
            width: auto;
        }

        .clue-note-title {
            font-family: 'DungGeunMo', sans-serif;
            color: white;
            font-size: 1.0rem;
            letter-spacing: 0.08em;
            background: rgba(0, 0, 0, 0.50);
            padding: 10px 30px;
            border-radius: 30px;
        }

        .clue-note-body {
            flex: 1;
            display: flex;
            gap: 50px;
            align-items: flex-end;
            overflow: hidden;
        }

        .clue-note-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 20px;
            flex-shrink: 0;
        }

        #clue-note-pico {
            width: 290px;
        }

        #clue-note-panel {
            flex: 1;
            align-self: stretch;
            background: rgba(30, 45, 70, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #clue-note-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        #clue-note-list::-webkit-scrollbar { width: 4px; }
        #clue-note-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }

        .clue-toggle-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        }

        .clue-toggle-header {
            font-family: 'DungGeunMo', sans-serif;
            color: rgba(255, 255, 255, 0.90);
            cursor: pointer;
            padding: 16px 0;
            font-size: 1.05rem;
            transition: color 0.2s;
            user-select: none;
        }

        .clue-toggle-header:hover { color: #4be1e6; }

        .clue-toggle-body {
            display: none;
            padding: 8px 0 20px;
        }

        .clue-mission-img {
            width: 100%;
            border-radius: 8px;
        }

        .clue-qa-text {
            font-family: 'DungGeunMo', sans-serif;
            color: rgba(200, 230, 255, 0.85);
            font-size: 0.90rem;
            line-height: 1.8;
            white-space: pre-wrap;
            margin: 0;
        }

        .clue-characters-row {
            display: flex;
            gap: 12px;
        }

        .clue-characters-row img {
            flex: 1;
            min-width: 0;
            border-radius: 8px;
        }

        #clue-note-back-btn {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: rgba(255, 255, 255, 0.80);
            font-family: 'DungGeunMo', sans-serif;
            font-size: 0.85rem;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
        }

        #clue-note-back-btn:hover {
            color: white;
            border-color: white;
        }
    </style>
</head>
<body>
    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 99999; pointer-events: none; transition: opacity 1s ease;"></div>

    <div id="start-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:99998; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <img src="{{ url_for('static', filename='images/hateslop/start_bg.png') }}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1;" alt="배경">
        <img src="{{ url_for('static', filename='images/hateslop/start_start_button.png') }}" id="game-start-btn" style="position:relative; z-index:2; margin-top:15%; cursor:pointer; width:150px; transition:transform 0.2s ease, filter 0.2s ease;" alt="START">
    </div>

    <div id="intro-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:99997; justify-content:center; align-items:center;">
        <p id="intro-overlay-text" style="color:white; font-size:1.5rem; font-family:'DungGeunMo', sans-serif; text-align:center; line-height:2; white-space:pre-wrap; max-width:700px; padding:0 40px;"></p>
    </div>

    <!-- [피코 대화 시작] -->
    <div id="main-game-ui" style="display: none;">
        <header class="top-header">
            <img src="{{ url_for('static', filename='images/hateslop/logo.png') }}" alt="Project Ariadne" class="logo">
        </header>

        <div class="game-layout">
            <div class="sidebar">
                <div class="sidebar-panel-img">
                    <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_left_box.png') }}" class="bg-layer" alt="사이드바 대화 시작 배경">

                    <div class="sidebar-content">
                        <div class="ui-img-box power-wrapper">
                            <img src="{{ url_for('static', filename='images/hateslop/pico_chat_start_left_engine.png') }}" alt="전력량">
                            <div class="battery-icons">

                    method: 'POST',

                    body: JSON.stringify({
                        message: userMessage,
                        phase: requestPhase
                    })
                });
                const data = await response.json();
                return {
                    answer: data.answer ?? data.reply ?? "",
                    imageType: data.imageType ?? "none",
                    isQuestion: data.isQuestion ?? (!isNameInputMode && !isJobInputMode),
                    isJobAttempt: data.isJobAttempt ?? isJobInputMode,
                    isJobCorrect: data.isJobCorrect ?? false,
                    isNameAttempt: data.isNameAttempt ?? isNameInputMode,
                    isNameCorrect: data.isNameCorrect ?? false,
                };

                nextSceneLogic();
                return;
            }
            if (!isNameInputMode && !isJobInputMode) {
                if (currentBattery <= 0) return;
                decreaseBattery();
            }
            if (!isNameInputMode && !isJobInputMode && (message.includes('대화 기록') || message.includes('대화기록'))) {
                await handleUserInput(message);
                return;
            }
            await handleUserInput(message);
        }
        
        function dissolveToScene(fromIdx, toIdx) {
            const fromScene = scenes[fromIdx];
            const toScene = scenes[toIdx];
            const isPicoDialogue = (s) => s && s.showPico && !s.showRoleAuth && !s.showMissionFile && !s.showChatRecord && !s.isBriefing && !s.showAlbumHint;
            const bgSame = fromScene?.bgImage === toScene?.bgImage;
            if (isPicoDialogue(fromScene) && isPicoDialogue(toScene) && bgSame) {
                renderScene(toIdx);
                return;
            }
            const overlay = document.getElementById('fade-overlay');
            overlay.style.transition = 'opacity 0.35s ease';
            overlay.style.opacity = '1';
            setTimeout(() => {
                renderScene(toIdx);
                setTimeout(() => { overlay.style.opacity = '0'; }, 50);
            }, 380);
        }

                    roleAuthNextBtn.style.visibility = 'visible';
                } else if (roleAuthNextBtn) {
                    roleAuthNextBtn.style.visibility = 'hidden';
                }
                if (scene.autoAdvanceSec) {
                    autoAdvanceTimer = setTimeout(nextSceneLogic, scene.autoAdvanceSec * 1000);
                }
                return;
            }

            // 3. 미션 파일 화면
            else if (scene.showMissionFile) {
                missionFileUnlocked = true;
                centerDisplayWrapper.className = 'briefing-layout';
                picoAvatar.className = 'character-pico pico-small';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'none';
                missionNextBtn.style.visibility = scene.showArrow ? 'visible' : 'hidden';
                return;
            } 

            // 4. 브리핑 화면 (정적 이미지)
            else if (scene.isBriefing) {
                centerDisplayWrapper.className = 'briefing-layout';
                picoAvatar.className = 'character-pico pico-small';
                standardChatArea.style.display = 'none';
                briefingArea.style.display = 'flex';
                if (briefingNextBtn) briefingNextBtn.style.visibility = scene.showArrow ? 'visible' : 'hidden';
                return;
            }
            
            // 5. 일반 대화 화면 (피코 중앙)
            else {
                centerDisplayWrapper.className = 'normal-layout';
                centerDisplayWrapper.style.justifyContent = '';
                centerDisplayWrapper.style.paddingBottom = '';
                picoAvatar.className = 'character-pico pico-normal';
                picoAvatar.style.position = '';
                picoAvatar.style.left = '';
                picoAvatar.style.top = '';
                picoAvatar.style.bottom = '';
                picoAvatar.style.transform = '';
                picoAvatar.style.width = '';
                standardChatArea.style.display = 'flex';
                briefingArea.style.display = 'none';
                targetTextObj = chatHistoryObj;
                targetArrowBtn = nextArrowBtn;
            }

            if (scene.playAudio) {
                const audio = new Audio(`/static/${scene.playAudio}`);
                audio.play();
            }

            // 텍스트 타이핑 로직
            targetTextObj.textContent = ""; 
            targetArrowBtn.style.visibility = 'hidden';

            if (scene.instantText) {
                targetTextObj.textContent = scene.text;
                if (scene.showArrow) {
                    targetArrowBtn.style.visibility = 'visible';
                }
                if (scene.autoAdvanceSec) {
                    autoAdvanceTimer = setTimeout(nextSceneLogic, scene.autoAdvanceSec * 1000);
                }
                return;
            }

            let charIndex = 0;
            typingInterval = setInterval(() => {
                if (charIndex < scene.text.length) {
                    targetTextObj.textContent += scene.text[charIndex];
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    if (scene.showArrow) {
                        targetArrowBtn.style.visibility = 'visible';
                    }
                    if (scene.autoAdvanceSec) {
                        autoAdvanceTimer = setTimeout(nextSceneLogic, scene.autoAdvanceSec * 1000);
                    }
                }
            }, 40);
        }

        function playIntroSequence() {
            // 게임 UI는 숨기고 영상 레이어만 보이게 설정
            mainGameUI.style.display = 'none';
            videoOverlay.style.display = 'block';

            // 첫 번째 영상 로드 및 재생
            endingVideo.src = introVideos[currentIntroIndex];
            endingVideo.play();

            // 영상이 끝날 때마다 실행되는 이벤트 리스너
            endingVideo.onended = () => {
                currentIntroIndex++;

                if (currentIntroIndex < introVideos.length) {
                    // 다음 인트로 영상이 있으면 재생
                    endingVideo.src = introVideos[currentIntroIndex];
                    endingVideo.play();
                } else {
                    // 모든 영상이 끝나면 영상 레이어 숨기고 게임 시작
                    videoOverlay.style.display = 'none';
                    mainGameUI.style.display = 'flex';
                    renderScene(0);
                }
            };
        }

        if (recordNextBtn) recordNextBtn.addEventListener('click', nextSceneLogic);
        if (nextArrowBtn) nextArrowBtn.addEventListener('click', nextSceneLogic);
        if (briefingNextBtn) briefingNextBtn.addEventListener('click', nextSceneLogic);
        if (missionNextBtn) missionNextBtn.addEventListener('click', nextSceneLogic);
        if (roleAuthNextBtn) roleAuthNextBtn.addEventListener('click', nextSceneLogic);

        // ─── 단서 노트 ────────────────────────────────────────────
        function createClueToggle(label, buildContent) {
            const item = document.createElement('div');
            item.className = 'clue-toggle-item';

            const header = document.createElement('div');
            header.className = 'clue-toggle-header';
            header.textContent = '+ ' + label;

            const body = document.createElement('div');
            body.className = 'clue-toggle-body';
            buildContent(body);

            header.addEventListener('click', () => {
                const isOpen = body.style.display !== 'none';
                body.style.display = isOpen ? 'none' : 'block';
                header.textContent = (isOpen ? '+ ' : '- ') + label;
            });

            item.appendChild(header);
            item.appendChild(body);
            return item;
        }

        function openClueNote() {
            mainGameUI.style.display = 'none';

            const list = document.getElementById('clue-note-list');
            list.innerHTML = '';

            // 프로젝트 파일 (미션 파일 장면 이후에만 표시)
            if (missionFileUnlocked) {
                list.appendChild(createClueToggle('프로젝트 파일', (body) => {
                    const img = document.createElement('img');
                    img.src = '/static/images/hateslop/mission_file.png';
                    img.className = 'clue-mission-img';
                    body.appendChild(img);
                }));
            }

            // 역대 질문 & 피코 답변
            qaHistory.forEach((item, i) => {
                const shortQ = item.question.length > 20 ? item.question.slice(0, 20) + '…' : item.question;
                list.appendChild(createClueToggle(`Q${i + 1}. ${shortQ}`, (body) => {
                    const p = document.createElement('p');
                    p.className = 'clue-qa-text';
                    p.textContent = item.answer;
                    body.appendChild(p);
                }));
            });

            // 인물 정보 (이름 추론 단계 이후)
            if (namePhaseUnlocked) {
                list.appendChild(createClueToggle('인물 정보', (body) => {
                    const row = document.createElement('div');
                    row.className = 'clue-characters-row';
                    ['seoyunjae.png', 'mateo.png', 'martaeng.png'].forEach(fname => {
                        const img = document.createElement('img');
                        img.src = `/static/images/hateslop/${fname}`;
                        row.appendChild(img);
                    });
                    body.appendChild(row);
                }));
            }

            document.getElementById('clue-note-overlay').style.display = 'flex';
        }

        function closeClueNote() {
            document.getElementById('clue-note-overlay').style.display = 'none';
            mainGameUI.style.display = 'flex';
        }

        const btnClue = document.getElementById('btn-clue');
        if (btnClue) btnClue.addEventListener('click', openClueNote);
        const clueBackBtn = document.getElementById('clue-note-back-btn');
        if (clueBackBtn) clueBackBtn.addEventListener('click', closeClueNote);
        // ─────────────────────────────────────────────────────────

        if (sendBtn) sendBtn.addEventListener('click', onSendClick);
        if (userInputField) userInputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') onSendClick();
        });

        if (recommendTextList) {
            recommendTextList.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li && userInputField) {
                    userInputField.value = li.textContent.replace(/^-\s*/, '').trim();
                    userInputField.focus();
                }
            });
        }

        function showIntroTyping(text, holdMs, onDone) {
            const introOverlay = document.getElementById('intro-overlay');
            const introText = document.getElementById('intro-overlay-text');
            // 오버레이(검정 배경)는 항상 유지, 텍스트만 페이드
            introOverlay.style.display = 'flex';
            introOverlay.style.opacity = '1';
            introText.style.transition = '';
            introText.style.opacity = '1';
            introText.textContent = '';
            let i = 0;
            const iv = setInterval(() => {
                if (i < text.length) {
                    introText.textContent += text[i++];
                } else {
                    clearInterval(iv);
                    setTimeout(() => {
                        introText.style.transition = 'opacity 0.5s';
                        introText.style.opacity = '0';
                        setTimeout(onDone, 500);
                    }, holdMs);
                }
            }, 80);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fade-overlay').style.opacity = '0';
            const startBtn = document.getElementById('game-start-btn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    // 게임 재시작 시 상태 초기화
                    currentSceneIndex = 0;
                    currentBattery = 5;
                    questionCount = 0;
                    jobQuestionCount = 0;
                    currentPhase = "job";
                    qaHistory = [];
                    missionFileUnlocked = false;
                    namePhaseUnlocked = false;
                    jobFailCount = 0;
                    nameFailCount = 0;
                    isJobInputMode = false;
                    isNameInputMode = false;
                    clearAutoAdvance();
                    scenes.length = 36;
                    for (let i = 1; i <= 5; i++) {
                        const bat = document.getElementById(`bat-${i}`);
                        if (bat) bat.style.opacity = '1';
                    }

                    const startScreen = document.getElementById('start-screen');
                    startScreen.style.transition = 'opacity 0.6s';
                    startScreen.style.opacity = '0';
                    setTimeout(() => {
                        startScreen.style.display = 'none';
                        showIntroTyping("당신은 우주 한가운데에 있습니다.", 2000, () => {
                        showIntroTyping("그러나 기억이 아무것도 나지 않습니다.\n이름도, 이곳에 온 이유도,\n함께 있던 사람들의 얼굴도 떠오르지 않습니다.", 2500, () => {
                        showIntroTyping("다만 한 가지는 분명합니다.", 2000, () => {
                        showIntroTyping("집으로 돌아가야 합니다.\n그 집조차 기억이 나지 않지만요.", 2500, () => {

                            document.getElementById('intro-overlay').style.display = 'none';
                            videoOverlay.style.display = 'block';
                            endingVideo.src = '/static/videos/hateslop/opening.mp4';
                            endingVideo.play();
                            endingVideo.onended = () => {
                                videoOverlay.style.display = 'none';
                                document.getElementById('intro-overlay').style.display = 'none';
                                mainGameUI.style.display = 'flex';
                                renderScene(0);
                            };
                        });
                        });
                        });
                        });
                    }, 600);
                });
            }
        });
    </script>
</body>
